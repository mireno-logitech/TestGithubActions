name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Created from the selected ref if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and test
        run: |
          msbuild CounterApp.sln /m /p:Configuration=Release /p:Platform=x64
          .\bin\x64\Release\CounterTests.exe

      - name: Package
        run: Compress-Archive -Path bin\x64\Release\CounterApp.exe -DestinationPath CounterApp-${{ env.TAG }}-win-x64.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ env.TAG }}" "CounterApp-${{ env.TAG }}-win-x64.zip" --title "${{ env.TAG }}" --generate-notes --target "${{ github.sha }}"
